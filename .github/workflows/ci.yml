name: MusicMatch checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: musicmatch_test
          POSTGRES_USER: musicmatch
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U musicmatch -d musicmatch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://musicmatch:test_password@127.0.0.1:5432/musicmatch_test
      TEST_DATABASE_URL: postgresql://musicmatch:test_password@127.0.0.1:5432/musicmatch_test
      APP_ORIGIN: http://127.0.0.1:5173
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Generate ephemeral test configuration
        run: |
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; import {randomBytes} from 'node:crypto'; writeFileSync('.env', 'JWT_SECRET=' + randomBytes(32).toString('hex') + '\n')"
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
