name: CI

on:
  push:
    branches: [main, codex/postgres-jwt]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: musicmatch
          POSTGRES_USER: musicmatch
          POSTGRES_PASSWORD: musicmatch_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musicmatch -d musicmatch"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://musicmatch:musicmatch_password@127.0.0.1:5432/musicmatch
      LEGACY_DATABASE_URL: postgres://musicmatch:musicmatch_password@127.0.0.1:5432/musicmatch_legacy_test
      DJANGO_SECRET_KEY: ci-django-secret-key-000000000000000000
      JWT_SECRET: ci-jwt-secret-key-000000000000000000000
      DJANGO_DEBUG: "1"
      APP_ORIGIN: http://127.0.0.1:8000
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Static checks
        run: |
          python -m compileall config music scripts tests manage.py
          python manage.py check
      - name: Migrate fresh database
        run: python manage.py migrate --noinput
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run Django tests
        run: python manage.py test music.tests --verbosity 2
      - name: Create legacy database
        run: |
          python - <<'PY'
          import psycopg
          conn = psycopg.connect('postgres://musicmatch:musicmatch_password@127.0.0.1:5432/postgres', autocommit=True)
          with conn:
              conn.execute('DROP DATABASE IF EXISTS musicmatch_legacy_test')
              conn.execute('CREATE DATABASE musicmatch_legacy_test OWNER musicmatch')
          PY
      - name: Check legacy database upgrade
        run: python tests/check_legacy_upgrade.py
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Browser flow without JavaScript
        run: python manage.py test tests.test_browser --verbosity 2
