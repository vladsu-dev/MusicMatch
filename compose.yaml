services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: musicmatch
      POSTGRES_USER: musicmatch
      POSTGRES_PASSWORD: musicmatch_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - musicmatch_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicmatch -d musicmatch"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  musicmatch_data:
