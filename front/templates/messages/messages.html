<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Match — сообщения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ==========================================================
     Переменные темы (та же гамма, что и на основном сайте)
     ========================================================== */
  :root {
    --canvas: #F0F0F6;
    --canvas-alt: #E3E2EF;
    --panel: #FFFFFF;
    --ink: #24222E;
    --ink-soft: #6E6B80;
    --blue: #4A63E8;
    --blue-soft: #DCE1FB;
    --purple: #7C5CFC;
    --purple-soft: #E9E3FE;
    --slate: #8B8898;
    --slate-soft: #E5E4EC;
    --white: #FFFFFF;

    --shadow-sm: 0 6px 16px -8px rgba(36, 34, 46, 0.18);
    --shadow-md: 0 20px 40px -16px rgba(36, 34, 46, 0.28),
                 0 8px 20px -12px rgba(36, 34, 46, 0.16);
    --shadow-lg: 0 30px 60px -20px rgba(36, 34, 46, 0.35);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    background: var(--canvas);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  button {
    font-family: 'Inter', sans-serif;
    border: none;
    background: none;
    cursor: pointer;
  }

  input {
    font-family: 'Inter', sans-serif;
  }

  ::selection {
    background: var(--purple-soft);
    color: var(--ink);
  }

  :focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }

  /* ==========================================================
     Каркас приложения
     ========================================================== */
  .app-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    padding: 16px 28px;
    background: rgba(240, 240, 246, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(36, 34, 46, 0.06);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 20px;
    font-weight: 500;
  }

  .brand svg {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  .top-bar-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    background: var(--white);
    border-radius: 50%;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
  }

  .icon-btn svg {
    width: 17px;
    height: 17px;
    stroke: var(--ink);
  }

  .me-avatar {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    border-radius: 58% 42% 38% 62% / 55% 40% 60% 45%;
  }

  /* ==========================================================
     Тело мессенджера: список чатов + окно диалога
     ========================================================== */
  .messenger-body {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* ---------- список чатов ---------- */
  .chat-list {
    display: flex;
    flex-direction: column;
    width: 360px;
    flex-shrink: 0;
    border-right: 1px solid rgba(36, 34, 46, 0.07);
  }

  .chat-list-head {
    flex-shrink: 0;
    padding: 20px 20px 14px;
  }

  .chat-list-head h1 {
    margin: 0 0 14px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 25px;
    font-weight: 500;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--white);
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
  }

  .search-box svg {
    width: 15px;
    height: 15px;
    stroke: var(--ink-soft);
    flex-shrink: 0;
  }

  .search-box input {
    width: 100%;
    border: none;
    background: none;
    color: var(--ink);
    font-size: 14px;
  }

  .search-box input:focus {
    outline: none;
  }

  .search-box input::placeholder {
    color: var(--ink-soft);
  }

  .chat-items {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 16px;
  }

  .chat-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px;
    border-radius: 18px;
    text-align: left;
    transition: background .15s ease;
  }

  .chat-item:hover {
    background: var(--canvas-alt);
  }

  .chat-item.active {
    background: var(--white);
    box-shadow: var(--shadow-sm);
  }

  .chat-avatar {
    position: relative;
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border-radius: 58% 42% 38% 62% / 55% 40% 60% 45%;
  }

  .chat-avatar .dot {
    position: absolute;
    right: -1px;
    bottom: -1px;
    width: 12px;
    height: 12px;
    background: #57C67A;
    border: 2px solid var(--canvas);
    border-radius: 50%;
  }

  .chat-item-body {
    flex: 1;
    min-width: 0;
  }

  .chat-item-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .chat-item-top b {
    font-size: 14.5px;
    font-weight: 600;
  }

  .chat-item-top span {
    flex-shrink: 0;
    color: var(--ink-soft);
    font-size: 11.5px;
  }

  .chat-item-preview {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 3px;
  }

  .chat-item-preview p {
    overflow: hidden;
    margin: 0;
    color: var(--ink-soft);
    font-size: 13px;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .chat-item.unread .chat-item-preview p {
    color: var(--ink);
    font-weight: 600;
  }

  .unread-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 19px;
    height: 19px;
    flex-shrink: 0;
    padding: 0 5px;
    background: var(--blue);
    border-radius: 999px;
    color: var(--white);
    font-size: 11px;
    font-weight: 700;
  }

  /* ---------- окно диалога ---------- */
  .chat-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
  }

  .chat-panel-header {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    padding: 16px 26px;
    background: var(--white);
    border-bottom: 1px solid rgba(36, 34, 46, 0.07);
  }

  .back-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    flex-shrink: 0;
  }

  .back-btn svg {
    width: 18px;
    height: 18px;
  }

  .panel-avatar {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 58% 42% 38% 62% / 55% 40% 60% 45%;
  }

  .panel-info {
    flex: 1;
    min-width: 0;
  }

  .panel-info b {
    display: block;
    font-family: 'Fraunces', serif;
    font-size: 16.5px;
    font-weight: 500;
  }

  .panel-info span {
    color: var(--ink-soft);
    font-size: 12.5px;
  }

  .match-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    padding: 7px 13px;
    background: var(--purple-soft);
    border-radius: 999px;
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 700;
  }

  .match-chip svg {
    width: 12px;
    height: 12px;
    stroke: var(--purple);
  }

  /* трек-подсказка, закреплённая над лентой сообщений */
  .track-pin {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    margin: 14px 26px 0;
    padding: 12px 16px;
    background: var(--white);
    border-radius: 18px;
    box-shadow: var(--shadow-sm);
  }

  .track-pin .eq {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 24px;
    flex-shrink: 0;
  }

  .track-pin .eq i {
    display: block;
    width: 3.5px;
    background: var(--blue);
    border-radius: 2px;
  }

  .track-pin-text {
    flex: 1;
    min-width: 0;
  }

  .track-pin-text b {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
  }

  .track-pin-text span {
    color: var(--ink-soft);
    font-size: 12px;
  }

  .track-pin-label {
    flex-shrink: 0;
    color: var(--purple);
    font-size: 11.5px;
    font-weight: 700;
    text-align: right;
  }

  /* ---------- лента сообщений ---------- */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 26px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .day-divider {
    align-self: center;
    margin: 10px 0 16px;
    padding: 5px 14px;
    background: var(--canvas-alt);
    border-radius: 999px;
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 600;
  }

  .bubble-row {
    display: flex;
    margin-bottom: 8px;
  }

  .bubble-row.me {
    justify-content: flex-end;
  }

  .bubble {
    max-width: 60%;
    padding: 11px 15px;
    border-radius: 20px;
    font-size: 14.5px;
    line-height: 1.5;
  }

  .bubble-row.them .bubble {
    background: var(--white);
    border-bottom-left-radius: 6px;
    box-shadow: var(--shadow-sm);
    color: var(--ink);
  }

  .bubble-row.me .bubble {
    background: linear-gradient(135deg, var(--blue), var(--purple));
    border-bottom-right-radius: 6px;
    color: var(--white);
  }

  .bubble-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
    color: var(--ink-soft);
    font-size: 11px;
  }

  .bubble-row.me .bubble-meta {
    justify-content: flex-end;
  }

  .bubble-meta svg {
    width: 13px;
    height: 13px;
    stroke: var(--blue);
  }

  /* сообщение-трек */
  .track-bubble {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 66%;
    padding: 10px 14px;
    border-radius: 18px;
  }

  .bubble-row.them .track-bubble {
    background: var(--white);
    border-bottom-left-radius: 6px;
    box-shadow: var(--shadow-sm);
  }

  .bubble-row.me .track-bubble {
    background: linear-gradient(135deg, var(--blue), var(--purple));
    border-bottom-right-radius: 6px;
  }

  .track-bubble .eq {
    display: flex;
    align-items: flex-end;
    gap: 2.5px;
    height: 22px;
    flex-shrink: 0;
  }

  .track-bubble .eq i {
    display: block;
    width: 3px;
    border-radius: 2px;
  }

  .bubble-row.them .track-bubble .eq i {
    background: var(--blue);
  }

  .bubble-row.me .track-bubble .eq i {
    background: rgba(255, 255, 255, 0.85);
  }

  .track-bubble-text b {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
  }

  .track-bubble-text span {
    font-size: 11.5px;
    opacity: .8;
  }

  .bubble-row.them .track-bubble-text {
    color: var(--ink);
  }

  .bubble-row.me .track-bubble-text {
    color: var(--white);
  }

  /* индикатор "печатает" */
  .typing-row .bubble {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 14px 16px;
  }

  .typing-row .bubble i {
    display: block;
    width: 6px;
    height: 6px;
    background: var(--ink-soft);
    border-radius: 50%;
    animation: typing-bounce 1.1s ease-in-out infinite;
  }

  .typing-row .bubble i:nth-child(2) { animation-delay: .15s; }
  .typing-row .bubble i:nth-child(3) { animation-delay: .3s; }

  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- поле ввода ---------- */
  .composer {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    margin: 0 26px 20px;
    padding: 8px 8px 8px 18px;
    background: var(--white);
    border-radius: 999px;
    box-shadow: var(--shadow-md);
  }

  .composer input {
    flex: 1;
    min-width: 0;
    border: none;
    background: none;
    color: var(--ink);
    font-size: 14.5px;
  }

  .composer input:focus {
    outline: none;
  }

  .composer input::placeholder {
    color: var(--ink-soft);
  }

  .composer-attach {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 50%;
    transition: background .15s ease;
  }

  .composer-attach:hover {
    background: var(--canvas-alt);
  }

  .composer-attach svg {
    width: 18px;
    height: 18px;
    stroke: var(--ink-soft);
  }

  .composer-send {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    background: var(--blue);
    border-radius: 50%;
    box-shadow: var(--shadow-sm);
    transition: transform .15s ease;
  }

  .composer-send:hover {
    transform: translateY(-1px) scale(1.03);
  }

  .composer-send svg {
    width: 16px;
    height: 16px;
    stroke: var(--white);
  }

  /* ==========================================================
     Адаптив
     ========================================================== */
  @media (max-width: 860px) {
    .chat-list {
      width: 100%;
      border-right: none;
    }

    .chat-panel {
      position: fixed;
      inset: 0;
      top: 68px;
      background: var(--canvas);
      transform: translateX(100%);
      transition: transform .25s ease;
    }

    .app-shell.chat-open .chat-list {
      display: none;
    }

    .app-shell.chat-open .chat-panel {
      transform: translateX(0);
    }

    .back-btn {
      display: flex;
    }

    .bubble, .track-bubble {
      max-width: 80%;
    }
  }
</style>
</head>

        <input type="text" id="composerInput" placeholder="Напишите сообщение...">
        <button type="submit" class="composer-send" aria-label="Отправить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </main>
  </div>
</div>

<script>
function eqBars(container, heights, color){
  container.innerHTML = '';
  heights.forEach(h=>{
    const bar = document.createElement('i');
    bar.style.height = h + 'px';
    if(color) bar.style.background = color;
    container.appendChild(bar);
  });
}

    aura: ['#8B8898', '#4A63E8'],
    track: { name: '気づいたら片想い', artist: 'never young beach' },
    unread: 1,
    online: true,
    messages: [
      { from: 'them', type: 'text', text: 'А ты вообще как находишь такую редкую японскую сцену?', time: '09:14' }
    ],
    typing: false
  },
  {
    id: 'kostya',
    name: 'Костя', age: 30, city: 'Ереван', match: 74,
    aura: ['#7C5CFC', '#24222E'],
    track: { name: 'Marfa Тапес', artist: 'Джиган-моно' },
    unread: 0,
    online: false,
    messages: [
      { from: 'me', type: 'text', text: 'Го на концерт в субботу?', time: 'пт' },
      { from: 'them', type: 'text', text: 'Го, беру билеты', time: 'пт' }
    ],
    typing: false
  }
];

let activeId = 'margo';

// ---------- рендер списка чатов ----------
const chatItemsEl = document.getElementById('chatItems');

function renderChatList(){
  chatItemsEl.innerHTML = '';
  chats.forEach(chat => {
    const last = chat.messages[chat.messages.length - 1];
    const previewText = last.type === 'track'
      ? `🎵 Поделился(-ась) треком «${last.track.name}»`
      : last.text;

    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'chat-item' + (chat.id === activeId ? ' active' : '') + (chat.unread > 0 ? ' unread' : '');
    item.innerHTML = `
      <div class="chat-avatar" style="background:linear-gradient(135deg, ${chat.aura[0]}, ${chat.aura[1]})">
        ${chat.online ? '<span class="dot"></span>' : ''}
      </div>
      <div class="chat-item-body">
        <div class="chat-item-top">
          <b>${chat.name}</b>
          <span>${last.time}</span>
        </div>
        <div class="chat-item-preview">
          <p>${previewText}</p>
          ${chat.unread > 0 ? `<span class="unread-badge">${chat.unread}</span>` : ''}
        </div>
      </div>
    `;
    item.addEventListener('click', () => {
      chat.unread = 0;
      activeId = chat.id;
      renderChatList();
      renderPanel();
      document.getElementById('appShell').classList.add('chat-open');
    });
    chatItemsEl.appendChild(item);
  });
}

// ---------- рендер окна диалога ----------
const messagesEl = document.getElementById('messages');

function bubbleHTML(msg){
  if(msg.type === 'track'){
    const eqId = 'eq-' + Math.random().toString(36).slice(2, 8);
    setTimeout(() => {
      const el = document.getElementById(eqId);
      if(el) eqBars(el, [10, 17, 8, 20, 12, 16, 9]);
    }, 0);
    return `
      <div class="bubble-row ${msg.from === 'me' ? 'me' : 'them'}">
        <div class="track-bubble">
          <div class="eq" id="${eqId}"></div>
          <div class="track-bubble-text">
            <b>${msg.track.name}</b>
            <span>${msg.track.artist}</span>
          </div>
        </div>
      </div>
    `;
  }
  const readTick = msg.from === 'me' && msg.read
    ? '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4"><path d="M2 12l5 5L14 8M11 12l5 5L23 8"/></svg>'
    : '';
  return `
    <div class="bubble-row ${msg.from === 'me' ? 'me' : 'them'}">
      <div>
        <div class="bubble">${msg.text}</div>
        <div class="bubble-meta">${msg.time}${readTick}</div>
      </div>
    </div>
  `;
}

function renderPanel(){
  const chat = chats.find(c => c.id === activeId);

  document.getElementById('panelAvatar').style.background = `linear-gradient(135deg, ${chat.aura[0]}, ${chat.aura[1]})`;
  document.getElementById('panelName').textContent = `${chat.name}, ${chat.age}`;
  document.getElementById('panelLoc').textContent = chat.city;
  document.getElementById('panelMatch').textContent = `${chat.match}%`;
  document.getElementById('pinTrack').textContent = chat.track.name;
  document.getElementById('pinArtist').textContent = chat.track.artist;
  eqBars(document.getElementById('pinEq'), [9, 15, 7, 18, 11, 16, 8]);

  messagesEl.innerHTML = '<div class="day-divider">Сегодня</div>' + chat.messages.map(bubbleHTML).join('');

  if(chat.typing){
    const typingRow = document.createElement('div');
    typingRow.className = 'bubble-row them typing-row';
    typingRow.innerHTML = '<div class="bubble"><i></i><i></i><i></i></div>';
    messagesEl.appendChild(typingRow);
  }

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ---------- отправка сообщений ----------
const composer = document.getElementById('composer');
const composerInput = document.getElementById('composerInput');
const canned = [
  'Согласна, кстати — а какой у тебя плейлист на этой неделе?',
  'Ахах, было бы круто сходить вместе',
  'О, надо будет послушать сегодня вечером',
  'Точно! У нас явно совпадают частоты 🎧'
];

composer.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = composerInput.value.trim();
  if(!text) return;

  const chat = chats.find(c => c.id === activeId);
  chat.typing = false;
  chat.messages.push({ from: 'me', type: 'text', text, time: 'сейчас', read: false });
  composerInput.value = '';
  renderPanel();
  renderChatList();

  setTimeout(() => {
    chat.typing = true;
    renderPanel();
    setTimeout(() => {
      chat.typing = false;
      chat.messages.push({
        from: 'them', type: 'text',
        text: canned[Math.floor(Math.random() * canned.length)],
        time: 'сейчас'
      });
      renderPanel();
      renderChatList();
    }, 1400);
  }, 500);
});

// ---------- мобильная навигация назад к списку ----------
document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('appShell').classList.remove('chat-open');
});

renderChatList();
renderPanel();
</script>
</body>
</html>
